<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Jaegyu LEE, Portfolio 2026</title>
<meta name="description" content="Portfolio of Jaegyu LEE, architecture student, Paris.">
<link rel="stylesheet" href="assets/style.css?v=7">
</head>
<body class="book-mode">
<header class="bar">
  <div class="who"><strong>Jaegyu LEE</strong><span id="subtitle">Portfolio 2026 · LIMINA, From Threshold to City</span></div>
  <nav class="tools">
    <div class="language" role="group" aria-label="Portfolio language">
      <a id="langEn" href="?lang=en" lang="en" aria-label="English portfolio">EN</a>
      <a id="langFr" href="?lang=fr" lang="fr" aria-label="Portfolio en français">FR</a>
    </div>
    <div class="view-mode" role="group" aria-label="Portfolio view">
      <button id="bookMode" type="button" aria-pressed="true">Book</button>
      <button id="scrollMode" type="button" aria-pressed="false">Scroll</button>
    </div>
    <button id="fs" type="button" title="Full screen (F)">Full screen</button>
    <a id="dl" class="btn" href="assets/portfolio.pdf" download>Download PDF</a>
  </nav>
</header>

<!-- focus mode (full screen on phones too) -->
<button id="exitFocus" class="exit-focus" type="button" hidden aria-label="Exit full screen">✕</button>
<span id="countFloat" class="count-float" hidden></span>
<div id="rotateHint" class="rotate-hint" hidden></div>

<!-- book view: one spread at a time -->
<section id="book" class="book">
  <button id="prev" class="nav prev" type="button" aria-label="Previous page">‹</button>
  <div id="viewport" class="viewport" title="Click to zoom">
    <canvas id="canvas"></canvas>
    <p id="status" class="status">Loading portfolio…</p>
  </div>
  <button id="next" class="nav next" type="button" aria-label="Next page">›</button>
</section>
<div id="ctrl" class="ctrl">
  <button id="zoom" type="button" title="Zoom (Z or click the page)">Zoom</button>
  <input id="slider" type="range" min="1" max="1" value="1" aria-label="Page">
  <span id="count">1 / 1</span>
</div>

<!-- scroll view: all pages in a column -->
<main id="pages" class="pages" hidden></main>

<footer class="foot">
  <p><span id="footerCopy">Use ← → or swipe to turn pages. This page counts visits anonymously (page views only, no cookies, no personal data).</span> <a id="direct" href="assets/portfolio.pdf">Open the PDF directly</a></p>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="assets/viewer.js?v=8"></script>
</body>
</html>
